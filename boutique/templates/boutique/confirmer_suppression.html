{% extends 'boutique/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <h1 class="mb-4">Confirmer la suppression</h1>

        <p class="text-muted">
            Êtes-vous sûr de vouloir supprimer <strong>{{ produit.nom }}</strong> ?
        </p>

        {% if produit.image %}
        <img src="{{ produit.image.url }}" class="mb-3" style="width: 120px; height: 120px; object-fit: cover;">
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Oui, supprimer</button>
            <a href="{% url 'admin_produits' %}" class="btn btn-outline-secondary">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
